#version: '3.8'

services:
  # 1. PostgreSQL для ваших данных Home Credit (основная БД)
  my-postgres:
    image: postgres:15
    container_name: my-postgres
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: postgres
    volumes:
      - my_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - home-credit-network

  # 2. PostgreSQL для метаданных Airflow
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - home-credit-network

  # 3. Сервис Airflow
  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: supersecretkey
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./dags/home_credit_features:/opt/airflow/home_credit_features
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - home-credit-network
    command: standalone
    restart: unless-stopped

  # 4. Ваш ML-процессор для обработки данных
  home-credit-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-credit-processor:latest
    container_name: home-credit-processor
    environment:
      TEST_MODE: "true"
      ROW_LIMIT: "100"
      SAMPLE_SIZE: "500"
      DB_HOST: "my-postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "12345"
      DB_NAME: "postgres"
      DB_PORT: "5432"
      PYTHONUNBUFFERED: "1"
      # ДОБАВЛЯЕМ переменные для MLflow
      LOG_TO_MLFLOW: "true"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    networks:
      - home-credit-network

  # 5. PostgreSQL для метаданных MLflow
  mlflow-postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    networks:
      - home-credit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. MLflow Tracking Server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    command: >
      /bin/sh -c "
        echo 'Waiting for PostgreSQL...';
        sleep 10;
        mlflow server
          --backend-store-uri postgresql://mlflow:mlflow@mlflow-postgres/mlflow
          --default-artifact-root /mlflow/artifacts
          --host 0.0.0.0
          --port 5000
          --serve-artifacts
          --allowed-hosts '*'
      "
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5050:5000"
    networks:
      - home-credit-network
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  my_postgres_data:
  airflow_postgres_data:
  mlflow_postgres_data:
  mlflow_artifacts:

networks:
  home-credit-network:
    external: true