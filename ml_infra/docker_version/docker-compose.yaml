services:
  # 1. PostgreSQL для данных Home Credit
  my-postgres:
    image: postgres:15
    container_name: my-postgres
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: postgres
    volumes:
      - my_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - home-credit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PostgreSQL для метаданных Airflow
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - home-credit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Airflow
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./dags/home_credit_features:/opt/airflow/home_credit_features
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: standalone
    restart: unless-stopped
    networks:
      - home-credit-network

  # 4. ML-процессор
  home-credit-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-credit-processor:latest
    container_name: home-credit-processor
    depends_on:
      my-postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      TEST_MODE: "true"
      ROW_LIMIT: "100"
      SAMPLE_SIZE: "500"
      DB_HOST: "my-postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "12345"
      DB_NAME: "postgres"
      DB_PORT: "5432"
      PYTHONUNBUFFERED: "1"
      LOG_TO_MLFLOW: "true"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    networks:
      - home-credit-network

  # 6. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true" 
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - mlflow_db:/mlflow
    ports:
      - "5050:5000"
    networks:
      - home-credit-network
    restart: unless-stopped

volumes:
  my_postgres_data:
  airflow_postgres_data:
  mlflow_artifacts:
  mlflow_db:

networks:
  home-credit-network:
    driver: bridge